<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Pautas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --border: #e5e9f2;
    --text: #1f2937;
    --text-muted: #6b7280;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --shadow: 0 4px 14px rgba(31, 41, 55, 0.06);
    --shadow-hover: 0 10px 24px rgba(31, 41, 55, 0.10);
    --radius: 14px;
    --sidebar-w: 195px;
    --sidebar-bg: #1A2332;
    --sidebar-hover: rgba(255,255,255,0.07);
    --sidebar-active: rgba(29,158,117,0.20);
    --sidebar-text: rgba(255,255,255,0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    padding: 16px 0;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 100;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .sidebar-logo {
    width: 34px;
    height: 34px;
    background: #1D9E75;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
  }

  .sidebar-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); line-height: 1.35; }
  .sidebar-sub { font-size: 10px; color: rgba(255,255,255,0.4); }

  .nav-section { padding: 12px 10px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .nav-section-label { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: .08em; text-transform: uppercase; padding: 8px 8px 4px; }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    border: none;
    background: none;
    color: var(--sidebar-text);
    cursor: pointer;
    width: 100%;
    text-align: left;
    font-size: 13px;
    text-decoration: none;
    transition: background .12s, color .12s;
  }

  .nav-btn i { font-size: 17px; flex-shrink: 0; }
  .nav-btn:hover { background: var(--sidebar-hover); color: rgba(255,255,255,.85); }
  .nav-btn.active { background: var(--sidebar-active); color: #5DCAA5; font-weight: 500; }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.07);
    font-size: 10px;
    color: rgba(255,255,255,0.3);
  }

  .menu-toggle {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 200;
    width: 38px;
    height: 38px;
    align-items: center;
    justify-content: center;
    background: var(--sidebar-bg);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 99;
  }

  .main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  header.page-header {
    margin-bottom: 28px;
  }

  header.page-header h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header.page-header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 36px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px 20px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  .field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .field label .required {
    color: var(--danger);
  }

  input[type="text"],
  input[type="datetime-local"],
  textarea {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fbfcfe;
    color: var(--text);
    transition: border-color .15s ease, box-shadow .15s ease;
    width: 100%;
  }

  textarea {
    resize: vertical;
    min-height: 70px;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    background: #fff;
  }

  .form-actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    margin-top: 4px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background .15s ease, transform .1s ease;
  }

  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:active { transform: scale(0.98); }

  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .count-badge {
    font-size: 12px;
    font-weight: 600;
    background: #eef2ff;
    color: var(--primary);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: box-shadow .18s ease, transform .18s ease;
    animation: fadeIn .3s ease;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.35;
    word-break: break-word;
  }

  .card-date {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary);
    background: #eef2ff;
    padding: 5px 10px;
    border-radius: 8px;
    width: fit-content;
  }

  .card-date.no-date {
    color: var(--text-muted);
    background: #f3f4f6;
  }

  .card-obs {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
  }

  .card-obs.empty {
    font-style: italic;
    opacity: 0.7;
  }

  .card-footer {
    display: flex;
    justify-content: flex-end;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .btn-delete {
    background: transparent;
    color: var(--danger);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .15s ease, color .15s ease;
  }

  .btn-delete:hover {
    background: #fef2f2;
    color: var(--danger-hover);
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 24px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .empty-state .icon {
    font-size: 44px;
    margin-bottom: 12px;
    opacity: 0.6;
  }

  .empty-state h3 {
    margin: 0 0 6px;
    color: var(--text);
    font-size: 17px;
  }

  .empty-state p {
    margin: 0;
    font-size: 14px;
  }

  @media (max-width: 620px) {
    .form-grid { grid-template-columns: 1fr; }
    .container { padding: 20px 16px 48px; }
  }

  @media (max-width: 900px) {
    .menu-toggle { display: flex; }
    .sidebar { transform: translateX(-100%); transition: transform .2s ease; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    .main { margin-left: 0; }
    .container { padding-top: 72px; }
  }
</style>
</head>
<body>

<div class="app">
  <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu"><i class="ti ti-menu-2"></i></button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">🗂️</div>
      <div>
        <div class="sidebar-name">Gerenciamento de Pautas</div>
        <div class="sidebar-sub">Organização de reuniões</div>
      </div>
    </div>
    <nav class="nav-section">
      <div class="nav-section-label">Principal</div>
      <a class="nav-btn active" href="index.html"><i class="ti ti-notes"></i> Pautas</a>
    </nav>
    <div class="sidebar-footer">Sistema de uso interno</div>
  </aside>

  <main class="main">
<div class="container">
  <header class="page-header">
    <h1>🗂️ Gerenciador de Pautas</h1>
    <p>Organize suas pautas em cards, com data e observações.</p>
  </header>

  <section class="form-card">
    <form id="pauta-form">
      <div class="form-grid">
        <div class="field full">
          <label for="pauta">Pauta <span class="required">*</span></label>
          <input type="text" id="pauta" name="pauta" placeholder="Título da pauta" required>
        </div>

        <div class="field">
          <label for="dataInicial">Data Inicial</label>
          <input type="datetime-local" id="dataInicial" name="dataInicial">
        </div>

        <div class="field full">
          <label for="observacao">Observação</label>
          <textarea id="observacao" name="observacao" placeholder="Detalhes, contexto ou anotações sobre a pauta..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">＋ Adicionar Pauta</button>
        </div>
      </div>
    </form>
  </section>

  <section>
    <h2 class="section-title">
      Pautas Cadastradas
      <span class="count-badge" id="count-badge">0</span>
    </h2>
    <div class="cards-grid" id="cards-grid"></div>
  </section>
</div>
  </main>
</div>

<script>
  const menuToggle = document.getElementById('menu-toggle');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebar-overlay');

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
  }

  menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('open');
  });

  sidebarOverlay.addEventListener('click', closeSidebar);

  const STORAGE_KEY = 'pautas_cards_v1';

  const form = document.getElementById('pauta-form');
  const pautaInput = document.getElementById('pauta');
  const dataInput = document.getElementById('dataInicial');
  const obsInput = document.getElementById('observacao');
  const grid = document.getElementById('cards-grid');
  const countBadge = document.getElementById('count-badge');

  function loadPautas() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('Erro ao ler pautas do localStorage', e);
      return [];
    }
  }

  function savePautas(pautas) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pautas));
  }

  function formatDate(value) {
    if (!value) return null;
    const date = new Date(value);
    if (isNaN(date.getTime())) return null;
    return date.toLocaleString('pt-BR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const pautas = loadPautas();
    countBadge.textContent = pautas.length;

    if (pautas.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">📋</div>
          <h3>Nenhuma pauta cadastrada</h3>
          <p>Adicione uma pauta usando o formulário acima para começar.</p>
        </div>
      `;
      return;
    }

    const sorted = [...pautas].sort((a, b) => b.createdAt - a.createdAt);

    grid.innerHTML = sorted.map(item => {
      const formattedDate = formatDate(item.dataInicial);
      const dateHtml = formattedDate
        ? `<span class="card-date">📅 ${formattedDate}</span>`
        : `<span class="card-date no-date">📅 Sem data definida</span>`;

      const obsHtml = item.observacao
        ? `<div class="card-obs">${escapeHtml(item.observacao)}</div>`
        : `<div class="card-obs empty">Sem observações.</div>`;

      return `
        <div class="card" data-id="${item.id}">
          <div class="card-title">${escapeHtml(item.pauta)}</div>
          ${dateHtml}
          ${obsHtml}
          <div class="card-footer">
            <button class="btn-delete" data-id="${item.id}">🗑️ Excluir</button>
          </div>
        </div>
      `;
    }).join('');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const pauta = pautaInput.value.trim();
    if (!pauta) return;

    const novaPauta = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      pauta,
      dataInicial: dataInput.value || null,
      observacao: obsInput.value.trim(),
      createdAt: Date.now()
    };

    const pautas = loadPautas();
    pautas.push(novaPauta);
    savePautas(pautas);

    form.reset();
    pautaInput.focus();
    render();
  });

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('.btn-delete');
    if (!btn) return;

    const id = btn.dataset.id;
    const pautas = loadPautas().filter(p => p.id !== id);
    savePautas(pautas);
    render();
  });

  render();
</script>

</body>
</html>

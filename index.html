<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Pautas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234F46E5'/%3E%3Crect x='16' y='14' width='26' height='34' rx='4' fill='%233730A5'/%3E%3Crect x='22' y='20' width='26' height='34' rx='4' fill='%23FFFFFF'/%3E%3Cline x1='27' y1='29' x2='43' y2='29' stroke='%234F46E5' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='27' y1='36' x2='43' y2='36' stroke='%234F46E5' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='27' y1='43' x2='37' y2='43' stroke='%234F46E5' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function () {
    var saved = localStorage.getItem('pautas_theme');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  :root {
    --bg: #F7F5F2;
    --surface: #FFFFFF;
    --border: #E8E4DD;
    --text: #33312C;
    --text-muted: #8A8577;
    --primary: #0E9488;
    --primary-hover: #0B776D;
    --danger: #D6534A;
    --danger-hover: #B5382F;
    --shadow: 0 4px 14px rgba(51, 49, 44, 0.06);
    --shadow-hover: 0 10px 24px rgba(51, 49, 44, 0.10);
    --radius: 14px;
    --sidebar-w: 195px;
    --sidebar-bg: #22221D;
    --sidebar-hover: rgba(255,255,255,0.07);
    --sidebar-active: rgba(45,212,182,0.20);
    --sidebar-text: rgba(255,255,255,0.55);
    --tint: #E3F4F1;
    --tint-text: var(--primary);
    --tint-neutral: #F1EEE8;
    --input-bg: #FCFBF9;
    --danger-tint: #FBECEA;
    --success: #3F9142;
    --success-hover: #2F7233;
    --success-tint: #EBF5EA;
    --warning: #B7791F;
    --warning-hover: #8F5D14;
    --warning-tint: #FAF1DF;
  }

  :root[data-theme="dark"] {
    --bg: #1A1917;
    --surface: #232220;
    --border: rgba(255,250,240,0.09);
    --text: #E9E6DF;
    --text-muted: #9C978A;
    --primary: #2DD4BF;
    --primary-hover: #5EEAD4;
    --danger: #E8897E;
    --danger-hover: #F3AFA6;
    --shadow: 0 4px 14px rgba(0,0,0,0.35);
    --shadow-hover: 0 10px 24px rgba(0,0,0,0.45);
    --tint: rgba(45,212,191,0.16);
    --tint-text: #7DEEDD;
    --tint-neutral: rgba(255,250,240,0.06);
    --input-bg: #1A1917;
    --danger-tint: rgba(232,137,126,0.14);
    --success: #6FCB72;
    --success-hover: #9BDF9C;
    --success-tint: rgba(111,203,114,0.14);
    --warning: #E5B75B;
    --warning-hover: #F0CC85;
    --warning-tint: rgba(229,183,91,0.14);
  }

  * { box-sizing: border-box; }

  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    padding: 16px 0;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 100;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .sidebar-logo {
    width: 34px;
    height: 34px;
    background: #0E9488;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
  }

  .sidebar-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); line-height: 1.35; }
  .sidebar-sub { font-size: 10px; color: rgba(255,255,255,0.4); }

  .nav-section { padding: 12px 10px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .nav-section-label { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: .08em; text-transform: uppercase; padding: 8px 8px 4px; }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    border: none;
    background: none;
    color: var(--sidebar-text);
    cursor: pointer;
    width: 100%;
    text-align: left;
    font-size: 13px;
    text-decoration: none;
    transition: background .12s, color .12s;
  }

  .nav-btn:hover { background: var(--sidebar-hover); color: rgba(255,255,255,.85); }

  .nav-badge {
    margin-left: auto;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .nav-btn.active { background: var(--sidebar-active); color: #5EEAD4; font-weight: 500; }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.07);
    font-size: 10px;
    color: rgba(255,255,255,0.3);
  }

  .menu-toggle {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 200;
    width: 38px;
    height: 38px;
    align-items: center;
    justify-content: center;
    background: var(--sidebar-bg);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 99;
  }

  .main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  header.page-header {
    margin-bottom: 28px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header.page-header h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow);
    transition: background .15s ease, border-color .15s ease;
    flex-shrink: 0;
  }

  .theme-toggle:hover {
    border-color: var(--primary);
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 36px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px 20px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  .field-row {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px 20px;
  }

  .field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .field label .required {
    color: var(--danger);
  }

  .field label .field-optional {
    font-weight: 400;
    text-transform: none;
    letter-spacing: normal;
    opacity: 0.75;
  }

  .checkbox-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--input-bg);
  }

  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
  }

  .checkbox-item input {
    accent-color: var(--primary);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  input[type="text"],
  input[type="datetime-local"],
  select,
  textarea {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--text);
    transition: border-color .15s ease, box-shadow .15s ease;
    width: 100%;
  }

  textarea {
    resize: vertical;
    min-height: 70px;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(14, 148, 136, 0.14);
    background: var(--surface);
  }

  .form-actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    margin-top: 4px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background .15s ease, transform .1s ease;
  }

  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:active { transform: scale(0.98); }

  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .count-badge {
    font-size: 12px;
    font-weight: 600;
    background: var(--tint);
    color: var(--tint-text);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: box-shadow .18s ease, transform .18s ease;
    animation: fadeIn .3s ease;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes card-blink {
    0%, 100% { box-shadow: 0 0 0 2px var(--danger); }
    50% { box-shadow: 0 0 0 2px transparent; }
  }

  .card.overdue {
    border-color: var(--danger);
    animation: card-blink 1.2s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .card.overdue { animation: none; box-shadow: 0 0 0 2px var(--danger); }
  }

  @keyframes card-blink-green {
    0%, 100% { box-shadow: 0 0 0 2px var(--success); }
    50% { box-shadow: 0 0 0 2px transparent; }
  }

  .card.pending-blink {
    border-color: var(--success);
    animation: card-blink-green 1.2s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .card.pending-blink { animation: none; box-shadow: 0 0 0 2px var(--success); }
  }

  .card-eyebrow {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--primary);
    margin-bottom: -6px;
  }

  .card-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.35;
    word-break: break-word;
  }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .card-date,
  .card-author,
  .card-target {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--tint-text);
    background: var(--tint);
    padding: 5px 10px;
    border-radius: 8px;
    width: fit-content;
  }

  .card-date.no-date,
  .card-author.no-author,
  .card-target.no-target {
    color: var(--text-muted);
    background: var(--tint-neutral);
  }

  .card-deadline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--warning);
    background: var(--warning-tint);
    padding: 5px 10px;
    border-radius: 8px;
    width: fit-content;
  }

  .card-overdue-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--danger);
    background: var(--danger-tint);
    padding: 5px 10px;
    border-radius: 8px;
    width: fit-content;
  }

  .card-finalized-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--success);
    background: var(--success-tint);
    padding: 5px 10px;
    border-radius: 8px;
    width: fit-content;
  }

  .card-obs-input {
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.5;
    flex: 1;
    min-height: 48px;
    resize: vertical;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px 8px;
    margin: 0 -8px;
    background: transparent;
    transition: border-color .15s ease, background .15s ease;
  }

  .card-obs-input::placeholder {
    color: var(--text-muted);
    font-style: italic;
  }

  .card-obs-input:hover {
    border-color: var(--border);
  }

  .card-obs-input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--input-bg);
  }

  .card-footer {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .btn-delete,
  .btn-finalize,
  .btn-snooze,
  .btn-restore {
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .15s ease, color .15s ease;
  }

  .btn-finalize { grid-column: 1; justify-self: start; color: var(--success); }
  .btn-finalize:hover { background: var(--success-tint); color: var(--success-hover); }

  .btn-snooze { grid-column: 2; justify-self: center; color: var(--warning); }
  .btn-snooze:hover { background: var(--warning-tint); color: var(--warning-hover); }

  .btn-restore { grid-column: 1; justify-self: start; color: var(--primary); }
  .btn-restore:hover { background: var(--tint); color: var(--primary-hover); }

  .btn-delete { grid-column: 3; justify-self: end; color: var(--danger); }
  .btn-delete:hover { background: var(--danger-tint); color: var(--danger-hover); }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 24px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .empty-state .icon {
    font-size: 44px;
    margin-bottom: 12px;
    opacity: 0.6;
  }

  .empty-state h3 {
    margin: 0 0 6px;
    color: var(--text);
    font-size: 17px;
  }

  .empty-state p {
    margin: 0;
    font-size: 14px;
  }

  @media (max-width: 620px) {
    .form-grid { grid-template-columns: 1fr; }
    .field-row { grid-template-columns: 1fr; }
    .container { padding: 20px 16px 48px; }
  }

  @media (max-width: 900px) {
    .menu-toggle { display: flex; }
    .sidebar { transform: translateX(-100%); transition: transform .2s ease; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    .main { margin-left: 0; }
    .container { padding-top: 72px; }
  }

  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
  }

  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 28px;
  }

  .login-logo {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin: 0 auto 16px;
  }

  .login-card h1 {
    font-size: 19px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 4px;
  }

  .login-card > p {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin: 0 0 24px;
  }

  .login-card .field {
    margin-bottom: 16px;
  }

  .login-card .btn-primary {
    width: 100%;
    justify-content: center;
    margin-top: 4px;
  }

  .login-error {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--danger-tint);
    color: var(--danger-hover);
    font-size: 13px;
    text-align: center;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.open { display: flex; }

  .modal-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-hover);
    padding: 24px;
  }

  .modal-card h3 {
    margin: 0 0 4px;
    font-size: 17px;
  }

  .modal-card > p {
    margin: 0 0 16px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .modal-card textarea {
    resize: vertical;
    min-height: 80px;
    margin-bottom: 8px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
  }

  .btn-secondary {
    background: var(--tint-neutral);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 10px;
  }

  .btn-secondary:hover { background: var(--border); }

  .logout-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 6px;
    margin-top: 8px;
    background: none;
    border: none;
    color: var(--sidebar-text);
    font-size: 11px;
    cursor: pointer;
    text-align: left;
    border-radius: 8px;
    transition: background .12s, color .12s;
  }

  .logout-btn:hover { background: var(--sidebar-hover); color: rgba(255,255,255,.85); }
  .logout-btn svg { flex-shrink: 0; }
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <form class="login-card" id="login-form">
    <div class="login-logo">🗂️</div>
    <h1>Gerenciador de Pautas</h1>
    <p>Faça login para continuar</p>

    <div class="field">
      <label for="login-user">Usuário</label>
      <input type="text" id="login-user" placeholder="Usuário" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="login-password">Senha</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-primary" id="login-btn">Entrar</button>
    <div class="login-error" id="login-error" style="display:none;"></div>
  </form>
</div>

<div class="app" id="app-root" style="display:none;">
  <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">☰</button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">🗂️</div>
      <div>
        <div class="sidebar-name">Gerenciamento de Pautas</div>
        <div class="sidebar-sub">Organização de reuniões</div>
      </div>
    </div>
    <nav class="nav-section">
      <div class="nav-section-label">Principal</div>
      <button class="nav-btn" id="nav-cadastro" type="button">➕ Cadastrar Pauta</button>
      <button class="nav-btn active" id="nav-pendentes" type="button">🗒️ Pautas</button>
      <button class="nav-btn" id="nav-finalizados" type="button">✅ Finalizados</button>

<script>
  const menuToggle = document.getElementById('menu-toggle');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebar-overlay');

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
  }

  menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('open');
  });

  sidebarOverlay.addEventListener('click', closeSidebar);

  const navButtons = Array.from(document.querySelectorAll('.nav-section .nav-btn'));
  const formSection = document.getElementById('form-section');
  const cardsSection = document.getElementById('cards-section');
  const sectionTitleText = document.getElementById('section-title-text');

  let currentScreen = 'nav-pendentes';

  function currentPessoaFiltro() {
    const btn = document.getElementById(currentScreen);
    return btn ? btn.dataset.pessoa || null : null;
  }

  function showScreen(screen) {
    currentScreen = screen;
    navButtons.forEach(btn => btn.classList.toggle('active', btn.id === screen));

    const pessoa = currentPessoaFiltro();
    formSection.style.display = screen === 'nav-cadastro' ? '' : 'none';
    cardsSection.style.display = screen === 'nav-cadastro' ? 'none' : '';

    if (screen === 'nav-pendentes') sectionTitleText.textContent = 'Pautas Cadastradas';
    else if (screen === 'nav-finalizados') sectionTitleText.textContent = 'Pautas Finalizadas';
    else if (pessoa) sectionTitleText.textContent = `Pautas de ${pessoa}`;

    closeSidebar();
    render();
  }

  const SCREEN_PASSWORDS = {
    'nav-pessoa-jean': '040971'
  };
  const unlockedScreens = new Set();
  let pendingLockScreen = null;

  const pessoaLockOverlay = document.getElementById('pessoa-lock-overlay');
  const pessoaLockForm = document.getElementById('pessoa-lock-form');
  const pessoaLockPassword = document.getElementById('pessoa-lock-password');
  const pessoaLockError = document.getElementById('pessoa-lock-error');
  const pessoaLockCancel = document.getElementById('pessoa-lock-cancel');

  function openPessoaLock(screenId) {
    pendingLockScreen = screenId;
    pessoaLockPassword.value = '';
    pessoaLockError.style.display = 'none';
    pessoaLockOverlay.classList.add('open');
    pessoaLockPassword.focus();
  }

  function closePessoaLock() {
    pessoaLockOverlay.classList.remove('open');
    pendingLockScreen = null;
  }

  pessoaLockCancel.addEventListener('click', closePessoaLock);
  pessoaLockOverlay.addEventListener('click', (e) => {
    if (e.target === pessoaLockOverlay) closePessoaLock();
  });

  pessoaLockForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!pendingLockScreen) return;

    if (pessoaLockPassword.value === SCREEN_PASSWORDS[pendingLockScreen]) {
      unlockedScreens.add(pendingLockScreen);
      const target = pendingLockScreen;
      closePessoaLock();
      showScreen(target);
    } else {
      pessoaLockError.style.display = 'block';
    }
  });

  navButtons.forEach(btn => btn.addEventListener('click', () => {
    const requiredPass = SCREEN_PASSWORDS[btn.id];
    if (requiredPass && !unlockedScreens.has(btn.id)) {
      openPessoaLock(btn.id);
      return;
    }
    showScreen(btn.id);
  }));

  const THEME_KEY = 'pautas_theme';
  const themeToggle = document.getElementById('theme-toggle');

  function getCurrentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  function updateThemeToggleLabel(theme) {
    themeToggle.textContent = theme === 'dark' ? '☀️ Tema Claro' : '🌙 Tema Escuro';
  }

  updateThemeToggleLabel(getCurrentTheme());

  themeToggle.addEventListener('click', () => {
    const next = getCurrentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
    updateThemeToggleLabel(next);
  });

  const SUPABASE_URL = 'https://dsxotthnlhlsblorlvxe.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_E54QZ_jnl9Jc6JLYk9wQVw_YdSMLzww';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('pauta-form');
  const pautaInput = document.getElementById('pauta');
  const dataInput = document.getElementById('dataInicial');
  const dataLimiteInput = document.getElementById('dataLimite');
  const autorInput = document.getElementById('autor');
  const destinatariosGroup = document.getElementById('destinatarios-group');
  const obsInput = document.getElementById('observacao');
  const grid = document.getElementById('cards-grid');
  const countBadge = document.getElementById('count-badge');

  let pautasCache = [];

  function getSelectedDestinatarios() {
    return Array.from(destinatariosGroup.querySelectorAll('input:checked')).map(el => el.value);
  }

  function rowToItem(row) {
    return {
      id: row.id,
      pauta: row.pauta,
      dataInicial: row.data_inicial,
      dataLimite: row.data_limite,
      autor: row.autor || '',
      destinatarios: row.destinatarios || [],
      observacao: row.observacao || '',
      createdAt: new Date(row.created_at).getTime(),
      status: row.status,
      finalizadoAt: row.finalizado_at ? new Date(row.finalizado_at).getTime() : null,
      postponedAt: row.postponed_at ? new Date(row.postponed_at).getTime() : null
    };
  }

  async function fetchPautas() {
    const { data, error } = await supabaseClient
      .from('pautas')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Erro ao carregar pautas', error);
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h3>Erro ao carregar os dados</h3>
          <p>Verifique sua conexão com a internet e recarregue a página.</p>
        </div>
      `;
      return;
    }

    pautasCache = data.map(rowToItem);
    render();
  }

  function formatDate(value) {
    if (!value) return null;
    const date = new Date(value);
    if (isNaN(date.getTime())) return null;
    return date.toLocaleString('pt-BR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function localDateTimeToISO(value) {
    if (!value) return null;
    const date = new Date(value);
    if (isNaN(date.getTime())) return null;
    return date.toISOString();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function tituloDirecionamento(destinatarios) {
    if (!destinatarios || destinatarios.length === 0) return '';
    const nomes = destinatarios.map(nome => nome.split(' ')[0]);
    if (nomes.length === 1) return `Pauta de ${nomes[0]}`;
    return `Pauta de ${nomes.slice(0, -1).join(', ')} e ${nomes[nomes.length - 1]}`;
  }

  const OVERDUE_BUSINESS_DAYS = 3;

  function businessDaysSince(timestamp) {
    const start = new Date(timestamp);
    start.setHours(0, 0, 0, 0);
    const now = new Date();
    now.setHours(0, 0, 0, 0);

    let count = 0;
    const cur = new Date(start);
    while (cur < now) {
      cur.setDate(cur.getDate() + 1);
      const day = cur.getDay();
      if (day !== 0 && day !== 6) count++;
    }
    return count;
  }

  function overdueReference(item) {
    return item.postponedAt || item.createdAt;
  }

  function isOverdue(item) {
    return item.status !== 'finalizada' && businessDaysSince(overdueReference(item)) >= OVERDUE_BUSINESS_DAYS;
  }

  function updateNavBadges() {
    document.querySelectorAll('.nav-btn[data-pessoa]').forEach(btn => {
      const pessoa = btn.dataset.pessoa;
      const badge = document.getElementById('badge-' + btn.id.replace(/^nav-/, ''));
      if (!badge) return;

      const count = pautasCache.filter(p => p.status !== 'finalizada' && p.destinatarios.includes(pessoa)).length;
      if (count > 0) {
        badge.textContent = count;
        badge.style.display = '';
      } else {
        badge.style.display = 'none';
      }
    });
  }

  function render() {
    const pautas = pautasCache;
    const pessoa = currentPessoaFiltro();

    updateNavBadges();

    const visible = pautas.filter(item => {
      if (currentScreen === 'nav-finalizados') return item.status === 'finalizada';
      if (currentScreen === 'nav-pendentes') return item.status !== 'finalizada';
      if (pessoa) return item.destinatarios.includes(pessoa);
      return false;
    });
    countBadge.textContent = visible.length;

    if (visible.length === 0) {
      let icon = '📋';
      let title = 'Nenhuma pauta cadastrada';
      let text = 'Clique em "Cadastrar Pauta" no menu para começar.';

      if (currentScreen === 'nav-finalizados') {
        icon = '✅';
        title = 'Nenhuma pauta finalizada ainda';
        text = 'As pautas concluídas aparecem aqui quando você clicar em "Finalizar".';
      } else if (pessoa) {
        icon = '📥';
        title = `Nenhuma pauta direcionada a ${pessoa}`;
        text = '';
      }

      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">${icon}</div>
          <h3>${title}</h3>
          ${text ? `<p>${text}</p>` : ''}
        </div>
      `;
      return;
    }

    const sorted = currentScreen === 'nav-finalizados'
      ? [...visible].sort((a, b) => (b.finalizadoAt || 0) - (a.finalizadoAt || 0))
      : [...visible].sort((a, b) => b.createdAt - a.createdAt);

    grid.innerHTML = sorted.map(item => {
      const formattedDate = formatDate(item.dataInicial);
      const dateHtml = formattedDate
        ? `<span class="card-date">📅 ${formattedDate}</span>`
        : `<span class="card-date no-date">📅 Sem data definida</span>`;

      const formattedDeadline = formatDate(item.dataLimite);
      const deadlineHtml = formattedDeadline
        ? `<span class="card-deadline">⏳ Prazo: ${formattedDeadline}</span>`
        : '';

      const authorHtml = item.autor
        ? `<span class="card-author">👤 ${escapeHtml(item.autor)}</span>`
        : `<span class="card-author no-author">👤 Não informado</span>`;

      const targetHtml = item.destinatarios.length > 0
        ? item.destinatarios.map(nome => `<span class="card-target">🎯 ${escapeHtml(nome)}</span>`).join('')
        : `<span class="card-target no-target">🎯 Sem direcionamento</span>`;

      const eyebrowText = tituloDirecionamento(item.destinatarios);
      const eyebrowHtml = eyebrowText
        ? `<div class="card-eyebrow">${escapeHtml(eyebrowText)}</div>`
        : '';

      const overdue = isOverdue(item);
      const pendingBlink = item.status !== 'finalizada' && !overdue;
      const overdueHtml = overdue
        ? `<span class="card-overdue-badge">⚠️ Em atraso (${businessDaysSince(overdueReference(item))} dias úteis)</span>`
        : '';

      const finalizedHtml = item.status === 'finalizada'
        ? `<span class="card-finalized-badge">✅ Finalizado em ${formatDate(item.finalizadoAt)}</span>`
        : '';

      const obsHtml = `<textarea class="card-obs-input" data-id="${item.id}" placeholder="Adicionar observação...">${escapeHtml(item.observacao)}</textarea>`;

      const finalizeBtnHtml = item.status !== 'finalizada'
        ? `<button class="btn-finalize" data-id="${item.id}">✅ Finalizar</button>`
        : '';

      const snoozeBtnHtml = item.status !== 'finalizada'
        ? `<button class="btn-snooze" data-id="${item.id}">⏰ Adiar</button>`
        : '';

      const restoreBtnHtml = item.status === 'finalizada'
        ? `<button class="btn-restore" data-id="${item.id}">↩️ Restaurar</button>`
        : '';

      return `
        <div class="card${overdue ? ' overdue' : ''}${pendingBlink ? ' pending-blink' : ''}" data-id="${item.id}">
          ${eyebrowHtml}
          <div class="card-title">${escapeHtml(item.pauta)}</div>
          <div class="card-meta">
            ${dateHtml}
            ${deadlineHtml}
            ${authorHtml}
            ${targetHtml}
            ${overdueHtml}
            ${finalizedHtml}
          </div>
          ${obsHtml}
          <div class="card-footer">
            ${finalizeBtnHtml}
            ${snoozeBtnHtml}
            ${restoreBtnHtml}
            <button class="btn-delete" data-id="${item.id}">🗑️ Excluir</button>
          </div>
        </div>
      `;
    }).join('');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const pauta = pautaInput.value.trim();
    if (!pauta) return;

    const submitBtn = form.querySelector('.btn-primary');
    submitBtn.disabled = true;

    const { error } = await supabaseClient.from('pautas').insert({
      pauta,
      data_inicial: localDateTimeToISO(dataInput.value),
      data_limite: localDateTimeToISO(dataLimiteInput.value),
      autor: autorInput.value.trim(),
      destinatarios: getSelectedDestinatarios(),
      observacao: obsInput.value.trim(),
      status: 'pendente'
    });

    submitBtn.disabled = false;

    if (error) {
      console.error('Erro ao cadastrar pauta', error);
      alert('Não foi possível cadastrar a pauta. Verifique sua conexão e tente novamente.');
      return;
    }

    form.reset();
    await fetchPautas();
    showScreen('nav-pendentes');
  });

  grid.addEventListener('click', async (e) => {
    const deleteBtn = e.target.closest('.btn-delete');
    if (deleteBtn) {
      const id = deleteBtn.dataset.id;
      const { error } = await supabaseClient.from('pautas').delete().eq('id', id);
      if (error) { console.error('Erro ao excluir pauta', error); return; }
      await fetchPautas();
      return;
    }

    const finalizeBtn = e.target.closest('.btn-finalize');
    if (finalizeBtn) {
      const id = finalizeBtn.dataset.id;
      const { error } = await supabaseClient
        .from('pautas')
        .update({ status: 'finalizada', finalizado_at: new Date().toISOString() })
        .eq('id', id);
      if (error) { console.error('Erro ao finalizar pauta', error); return; }
      await fetchPautas();
      return;
    }

    const restoreBtn = e.target.closest('.btn-restore');
    if (restoreBtn) {
      const id = restoreBtn.dataset.id;
      const { error } = await supabaseClient
        .from('pautas')
        .update({ status: 'pendente', finalizado_at: null, postponed_at: new Date().toISOString() })
        .eq('id', id);
      if (error) { console.error('Erro ao restaurar pauta', error); return; }
      await fetchPautas();
      return;
    }

    const snoozeBtn = e.target.closest('.btn-snooze');
    if (snoozeBtn) {
      openSnoozeModal(snoozeBtn.dataset.id);
    }
  });

  grid.addEventListener('focusout', async (e) => {
    const textarea = e.target.closest('.card-obs-input');
    if (!textarea) return;

    const id = textarea.dataset.id;
    const novoValor = textarea.value.trim();
    const item = pautasCache.find(p => p.id === id);
    if (!item || item.observacao === novoValor) return;

    const { error } = await supabaseClient
      .from('pautas')
      .update({ observacao: novoValor })
      .eq('id', id);
    if (error) console.error('Erro ao salvar observação', error);
    else item.observacao = novoValor;
  });

  let snoozeTargetId = null;
  const snoozeOverlay = document.getElementById('snooze-overlay');
  const snoozeForm = document.getElementById('snooze-form');
  const snoozeJustification = document.getElementById('snooze-justification');
  const snoozeError = document.getElementById('snooze-error');
  const snoozeCancelBtn = document.getElementById('snooze-cancel');

  function openSnoozeModal(id) {
    snoozeTargetId = id;
    snoozeJustification.value = '';
    snoozeError.style.display = 'none';
    snoozeOverlay.classList.add('open');
    snoozeJustification.focus();
  }

  function closeSnoozeModal() {
    snoozeOverlay.classList.remove('open');
    snoozeTargetId = null;
  }

  snoozeCancelBtn.addEventListener('click', closeSnoozeModal);
  snoozeOverlay.addEventListener('click', (e) => {
    if (e.target === snoozeOverlay) closeSnoozeModal();
  });

  snoozeForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const justificativa = snoozeJustification.value.trim();
    if (!justificativa) {
      snoozeError.style.display = 'block';
      return;
    }

    const item = pautasCache.find(p => p.id === snoozeTargetId);
    if (!item) { closeSnoozeModal(); return; }

    const nota = `[Adiado em ${formatDate(new Date().toISOString())}] ${justificativa}`;
    const novaObservacao = item.observacao ? `${item.observacao}\n\n${nota}` : nota;

    const { error } = await supabaseClient
      .from('pautas')
      .update({ postponed_at: new Date().toISOString(), observacao: novaObservacao })
      .eq('id', snoozeTargetId);

    if (error) {
      console.error('Erro ao adiar pauta', error);
      return;
    }

    closeSnoozeModal();
    await fetchPautas();
  });

  let appInitialized = false;

  function initApp() {
    if (appInitialized) return;
    appInitialized = true;

    supabaseClient
      .channel('pautas-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pautas' }, () => {
        fetchPautas();
      })
      .subscribe();

    showScreen('nav-pendentes');
    fetchPautas();
    setInterval(render, 5 * 60 * 1000);
  }

  const LOGIN_USER = 'Estoque';
  const LOGIN_PASS = '12345678';

  const loginScreen = document.getElementById('login-screen');
  const appRoot = document.getElementById('app-root');
  const loginForm = document.getElementById('login-form');
  const loginUser = document.getElementById('login-user');
  const loginPassword = document.getElementById('login-password');
  const loginError = document.getElementById('login-error');
  const logoutBtn = document.getElementById('logout-btn');

  function showApp() {
    loginScreen.style.display = 'none';
    appRoot.style.display = '';
    initApp();
  }

  function showLogin() {
    loginScreen.style.display = '';
    appRoot.style.display = 'none';
  }

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    loginError.style.display = 'none';

    if (loginUser.value.trim() === LOGIN_USER && loginPassword.value === LOGIN_PASS) {
      loginPassword.value = '';
      showApp();
    } else {
      loginError.textContent = 'Usuário ou senha incorretos.';
      loginError.style.display = 'block';
    }
  });

  logoutBtn.addEventListener('click', () => {
    unlockedScreens.clear();
    showLogin();
  });

  showLogin();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Pautas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234F46E5'/%3E%3Crect x='16' y='14' width='26' height='34' rx='4' fill='%233730A5'/%3E%3Crect x='22' y='20' width='26' height='34' rx='4' fill='%23FFFFFF'/%3E%3Cline x1='27' y1='29' x2='43' y2='29' stroke='%234F46E5' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='27' y1='36' x2='43' y2='36' stroke='%234F46E5' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='27' y1='43' x2='37' y2='43' stroke='%234F46E5' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  (function () {
    var saved = localStorage.getItem('pautas_theme');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --border: #e5e9f2;
    --text: #1f2937;
    --text-muted: #6b7280;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --shadow: 0 4px 14px rgba(31, 41, 55, 0.06);
    --shadow-hover: 0 10px 24px rgba(31, 41, 55, 0.10);
    --radius: 14px;
    --sidebar-w: 195px;
    --sidebar-bg: #1A2332;
    --sidebar-hover: rgba(255,255,255,0.07);
    --sidebar-active: rgba(29,158,117,0.20);
    --sidebar-text: rgba(255,255,255,0.55);
    --tint: #eef2ff;
    --tint-text: var(--primary);
    --tint-neutral: #f3f4f6;
    --input-bg: #fbfcfe;
    --danger-tint: #fef2f2;
    --success: #16a34a;
    --success-hover: #15803d;
    --success-tint: #f0fdf4;
    --warning: #d97706;
    --warning-hover: #b45309;
    --warning-tint: #fffbeb;
  }

  :root[data-theme="dark"] {
    --bg: #10141f;
    --surface: #181f30;
    --border: rgba(255,255,255,0.08);
    --text: #e5e7eb;
    --text-muted: #97a1b5;
    --primary: #6366f1;
    --primary-hover: #7c7ff0;
    --danger: #f87171;
    --danger-hover: #fca5a5;
    --shadow: 0 4px 14px rgba(0,0,0,0.35);
    --shadow-hover: 0 10px 24px rgba(0,0,0,0.45);
    --tint: rgba(99,102,241,0.16);
    --tint-text: #a5b4fc;
    --tint-neutral: rgba(255,255,255,0.06);
    --input-bg: #10141f;
    --danger-tint: rgba(248,113,113,0.14);
    --success: #4ade80;
    --success-hover: #86efac;
    --success-tint: rgba(74,222,128,0.14);
    --warning: #fbbf24;
    --warning-hover: #fcd34d;
    --warning-tint: rgba(251,191,36,0.14);
  }

  * { box-sizing: border-box; }

  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    padding: 16px 0;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 100;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .sidebar-logo {
    width: 34px;
    height: 34px;
    background: #1D9E75;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
  }

  .sidebar-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); line-height: 1.35; }
  .sidebar-sub { font-size: 10px; color: rgba(255,255,255,0.4); }

  .nav-section { padding: 12px 10px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .nav-section-label { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: .08em; text-transform: uppercase; padding: 8px 8px 4px; }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    border: none;
    background: none;
    color: var(--sidebar-text);
    cursor: pointer;
    width: 100%;
    text-align: left;
    font-size: 13px;
    text-decoration: none;
    transition: background .12s, color .12s;
  }

  .nav-btn:hover { background: var(--sidebar-hover); color: rgba(255,255,255,.85); }
  .nav-btn.active { background: var(--sidebar-active); color: #5DCAA5; font-weight: 500; }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.07);
    font-size: 10px;
    color: rgba(255,255,255,0.3);
  }

  .menu-toggle {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 200;
    width: 38px;
    height: 38px;
    align-items: center;
    justify-content: center;
    background: var(--sidebar-bg);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 99;
  }

  .main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  header.page-header {
    margin-bottom: 28px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header.page-header h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header.page-header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow);
    transition: background .15s ease, border-color .15s ease;
    flex-shrink: 0;
  }

  .theme-toggle:hover {
    border-color: var(--primary);
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 36px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px 20px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  .field-row {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px 20px;
  }

  .field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .field label .required {
    color: var(--danger);
  }

  input[type="text"],
  input[type="datetime-local"],
  textarea {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--text);
    transition: border-color .15s ease, box-shadow .15s ease;
    width: 100%;
  }

  textarea {
    resize: vertical;
    min-height: 70px;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    background: var(--surface);
  }

  .form-actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    margin-top: 4px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background .15s ease, transform .1s ease;
  }

  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:active { transform: scale(0.98); }

  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .count-badge {
    font-size: 12px;
    font-weight: 600;
    background: var(--tint);
    color: var(--tint-text);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: box-shadow .18s ease, transform .18s ease;
    animation: fadeIn .3s ease;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes card-blink {
    0%, 100% { box-shadow: 0 0 0 2px var(--danger); }
    50% { box-shadow: 0 0 0 2px transparent; }
  }

  .card.overdue {
    border-color: var(--danger);
    animation: card-blink 1.2s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .card.overdue { animation: none; box-shadow: 0 0 0 2px var(--danger); }
  }

  .card-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.35;
    word-break: break-word;
  }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .card-date,
  .card-author,
  .card-target {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--tint-text);
    background: var(--tint);
    padding: 5px 10px;
    border-radius: 8px;
    width: fit-content;
  }

  .card-date.no-date,
  .card-author.no-author,
  .card-target.no-target {
    color: var(--text-muted);
    background: var(--tint-neutral);
  }

  .card-overdue-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--danger);
    background: var(--danger-tint);
    padding: 5px 10px;
    border-radius: 8px;
    width: fit-content;
  }

  .card-finalized-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--success);
    background: var(--success-tint);
    padding: 5px 10px;
    border-radius: 8px;
    width: fit-content;
  }

  .card-obs-input {
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.5;
    flex: 1;
    min-height: 48px;
    resize: vertical;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px 8px;
    margin: 0 -8px;
    background: transparent;
    transition: border-color .15s ease, background .15s ease;
  }

  .card-obs-input::placeholder {
    color: var(--text-muted);
    font-style: italic;
  }

  .card-obs-input:hover {
    border-color: var(--border);
  }

  .card-obs-input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--input-bg);
  }

  .card-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .btn-delete,
  .btn-finalize,
  .btn-snooze {
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .15s ease, color .15s ease;
  }

  .btn-delete { color: var(--danger); }
  .btn-delete:hover { background: var(--danger-tint); color: var(--danger-hover); }

  .btn-finalize { color: var(--success); margin-right: auto; }
  .btn-finalize:hover { background: var(--success-tint); color: var(--success-hover); }

  .btn-snooze { color: var(--warning); }
  .btn-snooze:hover { background: var(--warning-tint); color: var(--warning-hover); }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 24px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .empty-state .icon {
    font-size: 44px;
    margin-bottom: 12px;
    opacity: 0.6;
  }

  .empty-state h3 {
    margin: 0 0 6px;
    color: var(--text);
    font-size: 17px;
  }

  .empty-state p {
    margin: 0;
    font-size: 14px;
  }

  @media (max-width: 620px) {
    .form-grid { grid-template-columns: 1fr; }
    .field-row { grid-template-columns: 1fr; }
    .container { padding: 20px 16px 48px; }
  }

  @media (max-width: 900px) {
    .menu-toggle { display: flex; }
    .sidebar { transform: translateX(-100%); transition: transform .2s ease; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    .main { margin-left: 0; }
    .container { padding-top: 72px; }
  }
</style>
</head>
<body>

<div class="app">
  <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">☰</button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">🗂️</div>
      <div>
        <div class="sidebar-name">Gerenciamento de Pautas</div>
        <div class="sidebar-sub">Organização de reuniões</div>
      </div>
    </div>
    <nav class="nav-section">
      <div class="nav-section-label">Principal</div>
      <button class="nav-btn active" id="nav-pendentes" type="button">🗒️ Pautas</button>
      <button class="nav-btn" id="nav-finalizados" type="button">✅ Finalizados</button>
    </nav>
    <div class="sidebar-footer">Sistema de uso interno</div>
  </aside>

  <main class="main">
<div class="container">
  <header class="page-header">
    <div>
      <h1>🗂️ Gerenciador de Pautas</h1>
      <p id="page-subtitle">Organize suas pautas em cards, com data e observações.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button"></button>
  </header>

  <section class="form-card" id="form-section">
    <form id="pauta-form">
      <div class="form-grid">
        <div class="field full">
          <label for="pauta">Pauta <span class="required">*</span></label>
          <input type="text" id="pauta" name="pauta" placeholder="Título da pauta" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="dataInicial">Data Inicial</label>
            <input type="datetime-local" id="dataInicial" name="dataInicial">
          </div>

          <div class="field">
            <label for="autor">Cadastrado por</label>
            <input type="text" id="autor" name="autor" placeholder="Seu nome">
          </div>

          <div class="field">
            <label for="destinatario">Direcionado para</label>
            <input type="text" id="destinatario" name="destinatario" placeholder="Nome ou setor">
          </div>
        </div>

        <div class="field full">
          <label for="observacao">Observação</label>
          <textarea id="observacao" name="observacao" placeholder="Detalhes, contexto ou anotações sobre a pauta..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">＋ Adicionar Pauta</button>
        </div>
      </div>
    </form>
  </section>

  <section>
    <h2 class="section-title">
      <span id="section-title-text">Pautas Cadastradas</span>
      <span class="count-badge" id="count-badge">0</span>
    </h2>
    <div class="cards-grid" id="cards-grid"></div>
  </section>
</div>
  </main>
</div>

<script>
  const menuToggle = document.getElementById('menu-toggle');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebar-overlay');

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
  }

  menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('open');
  });

  sidebarOverlay.addEventListener('click', closeSidebar);

  const navPendentes = document.getElementById('nav-pendentes');
  const navFinalizados = document.getElementById('nav-finalizados');
  const formSection = document.getElementById('form-section');
  const pageSubtitle = document.getElementById('page-subtitle');
  const sectionTitleText = document.getElementById('section-title-text');

  const SCREENS = {
    pendentes: {
      subtitle: 'Organize suas pautas em cards, com data e observações.',
      sectionTitle: 'Pautas Cadastradas'
    },
    finalizados: {
      subtitle: 'Registro das pautas já concluídas.',
      sectionTitle: 'Pautas Finalizadas'
    }
  };

  let currentScreen = 'pendentes';

  function showScreen(screen) {
    currentScreen = screen;
    navPendentes.classList.toggle('active', screen === 'pendentes');
    navFinalizados.classList.toggle('active', screen === 'finalizados');
    formSection.style.display = screen === 'pendentes' ? '' : 'none';
    pageSubtitle.textContent = SCREENS[screen].subtitle;
    sectionTitleText.textContent = SCREENS[screen].sectionTitle;
    closeSidebar();
    render();
  }

  navPendentes.addEventListener('click', () => showScreen('pendentes'));
  navFinalizados.addEventListener('click', () => showScreen('finalizados'));

  const THEME_KEY = 'pautas_theme';
  const themeToggle = document.getElementById('theme-toggle');

  function getCurrentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  function updateThemeToggleLabel(theme) {
    themeToggle.textContent = theme === 'dark' ? '☀️ Tema Claro' : '🌙 Tema Escuro';
  }

  updateThemeToggleLabel(getCurrentTheme());

  themeToggle.addEventListener('click', () => {
    const next = getCurrentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
    updateThemeToggleLabel(next);
  });

  const STORAGE_KEY = 'pautas_cards_v1';

  const form = document.getElementById('pauta-form');
  const pautaInput = document.getElementById('pauta');
  const dataInput = document.getElementById('dataInicial');
  const autorInput = document.getElementById('autor');
  const destinatarioInput = document.getElementById('destinatario');
  const obsInput = document.getElementById('observacao');
  const grid = document.getElementById('cards-grid');
  const countBadge = document.getElementById('count-badge');

  function loadPautas() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('Erro ao ler pautas do localStorage', e);
      return [];
    }
  }

  function savePautas(pautas) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pautas));
  }

  function formatDate(value) {
    if (!value) return null;
    const date = new Date(value);
    if (isNaN(date.getTime())) return null;
    return date.toLocaleString('pt-BR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const OVERDUE_BUSINESS_DAYS = 3;

  function businessDaysSince(timestamp) {
    const start = new Date(timestamp);
    start.setHours(0, 0, 0, 0);
    const now = new Date();
    now.setHours(0, 0, 0, 0);

    let count = 0;
    const cur = new Date(start);
    while (cur < now) {
      cur.setDate(cur.getDate() + 1);
      const day = cur.getDay();
      if (day !== 0 && day !== 6) count++;
    }
    return count;
  }

  function overdueReference(item) {
    return item.postponedAt || item.createdAt;
  }

  function isOverdue(item) {
    return item.status !== 'finalizada' && businessDaysSince(overdueReference(item)) >= OVERDUE_BUSINESS_DAYS;
  }

  function render() {
    const pautas = loadPautas();
    const visible = pautas.filter(item =>
      currentScreen === 'finalizados' ? item.status === 'finalizada' : item.status !== 'finalizada'
    );
    countBadge.textContent = visible.length;

    if (visible.length === 0) {
      grid.innerHTML = currentScreen === 'finalizados'
        ? `
          <div class="empty-state">
            <div class="icon">✅</div>
            <h3>Nenhuma pauta finalizada ainda</h3>
            <p>As pautas concluídas aparecem aqui quando você clicar em "Finalizar".</p>
          </div>
        `
        : `
          <div class="empty-state">
            <div class="icon">📋</div>
            <h3>Nenhuma pauta cadastrada</h3>
            <p>Adicione uma pauta usando o formulário acima para começar.</p>
          </div>
        `;
      return;
    }

    const sorted = currentScreen === 'finalizados'
      ? [...visible].sort((a, b) => (b.finalizadoAt || 0) - (a.finalizadoAt || 0))
      : [...visible].sort((a, b) => b.createdAt - a.createdAt);

    grid.innerHTML = sorted.map(item => {
      const formattedDate = formatDate(item.dataInicial);
      const dateHtml = formattedDate
        ? `<span class="card-date">📅 ${formattedDate}</span>`
        : `<span class="card-date no-date">📅 Sem data definida</span>`;

      const authorHtml = item.autor
        ? `<span class="card-author">👤 ${escapeHtml(item.autor)}</span>`
        : `<span class="card-author no-author">👤 Não informado</span>`;

      const targetHtml = item.destinatario
        ? `<span class="card-target">🎯 Para: ${escapeHtml(item.destinatario)}</span>`
        : `<span class="card-target no-target">🎯 Sem direcionamento</span>`;

      const overdue = isOverdue(item);
      const overdueHtml = overdue
        ? `<span class="card-overdue-badge">⚠️ Em atraso (${businessDaysSince(overdueReference(item))} dias úteis)</span>`
        : '';

      const finalizedHtml = item.status === 'finalizada'
        ? `<span class="card-finalized-badge">✅ Finalizado em ${formatDate(item.finalizadoAt)}</span>`
        : '';

      const obsHtml = `<textarea class="card-obs-input" data-id="${item.id}" placeholder="Adicionar observação...">${escapeHtml(item.observacao)}</textarea>`;

      const finalizeBtnHtml = item.status !== 'finalizada'
        ? `<button class="btn-finalize" data-id="${item.id}">✅ Finalizar</button>`
        : '';

      const snoozeBtnHtml = overdue
        ? `<button class="btn-snooze" data-id="${item.id}">⏰ Adiar 3 dias</button>`
        : '';

      return `
        <div class="card${overdue ? ' overdue' : ''}" data-id="${item.id}">
          <div class="card-title">${escapeHtml(item.pauta)}</div>
          <div class="card-meta">
            ${dateHtml}
            ${authorHtml}
            ${targetHtml}
            ${overdueHtml}
            ${finalizedHtml}
          </div>
          ${obsHtml}
          <div class="card-footer">
            ${finalizeBtnHtml}
            ${snoozeBtnHtml}
            <button class="btn-delete" data-id="${item.id}">🗑️ Excluir</button>
          </div>
        </div>
      `;
    }).join('');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const pauta = pautaInput.value.trim();
    if (!pauta) return;

    const novaPauta = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      pauta,
      dataInicial: dataInput.value || null,
      autor: autorInput.value.trim(),
      destinatario: destinatarioInput.value.trim(),
      observacao: obsInput.value.trim(),
      createdAt: Date.now(),
      status: 'pendente',
      finalizadoAt: null,
      postponedAt: null
    };

    const pautas = loadPautas();
    pautas.push(novaPauta);
    savePautas(pautas);

    form.reset();
    pautaInput.focus();
    render();
  });

  grid.addEventListener('click', (e) => {
    const deleteBtn = e.target.closest('.btn-delete');
    if (deleteBtn) {
      const id = deleteBtn.dataset.id;
      const pautas = loadPautas().filter(p => p.id !== id);
      savePautas(pautas);
      render();
      return;
    }

    const finalizeBtn = e.target.closest('.btn-finalize');
    if (finalizeBtn) {
      const id = finalizeBtn.dataset.id;
      const pautas = loadPautas();
      const item = pautas.find(p => p.id === id);
      if (item) {
        item.status = 'finalizada';
        item.finalizadoAt = Date.now();
        savePautas(pautas);
        render();
      }
      return;
    }

    const snoozeBtn = e.target.closest('.btn-snooze');
    if (snoozeBtn) {
      const id = snoozeBtn.dataset.id;
      const pautas = loadPautas();
      const item = pautas.find(p => p.id === id);
      if (item) {
        item.postponedAt = Date.now();
        savePautas(pautas);
        render();
      }
    }
  });

  grid.addEventListener('focusout', (e) => {
    const textarea = e.target.closest('.card-obs-input');
    if (!textarea) return;

    const id = textarea.dataset.id;
    const pautas = loadPautas();
    const item = pautas.find(p => p.id === id);
    if (item) {
      item.observacao = textarea.value.trim();
      savePautas(pautas);
    }
  });

  render();
  setInterval(render, 5 * 60 * 1000);
</script>

</body>
</html>
